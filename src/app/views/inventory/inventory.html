<div class="p-4">
  <h4 class="mb-4"><i class="bi bi-boxes me-2"></i>Inventory Management</h4>

  @if (loadError) {
    <div class="alert alert-danger d-flex align-items-center py-2 mb-3" role="alert">
      <i class="bi bi-wifi-off me-2"></i> {{ loadError }}
    </div>
  }

  @if (addError) {
    <div class="alert alert-danger alert-dismissible d-flex align-items-center py-2 mb-3" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ addError }}
      <button type="button" class="btn-close ms-auto" (click)="addError = ''"></button>
    </div>
  }

  <app-product-form (productCreated)="onProductAdded($event)"></app-product-form>

  <hr class="my-4">

  <app-inventory-table
    [items]="items"
    (inventoryUpdated)="cargarInventario()">
  </app-inventory-table>
</div>
