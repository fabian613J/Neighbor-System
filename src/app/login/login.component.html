<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4"><i class="bi bi-person-lock"></i> Neighbor Login</h3>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" [(ngModel)]="username" class="form-control" placeholder="e.g. FabianFA">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" [(ngModel)]="password" class="form-control">
          </div>
          <button class="btn btn-primary w-100" (click)="onLogin()">Access Network</button>
        </div>
      </div>
    </div>
  </div>
</div>
