<div class="card p-4 shadow-sm mb-4 bg-light">
  <h5 class="text-secondary mb-3"><i class="bi bi-tools"></i> Register Item to Lend</h5>
  <div class="row g-3">
    <div class="col-md-3">
      <label class="form-label">Your Name (Neighbor)</label>
      <input type="text" [(ngModel)]="nuevoProd.vecino" class="form-control" placeholder="e.g., Carlos">
    </div>
    <div class="col-md-3">
      <label class="form-label">Item</label>
      <input type="text" [(ngModel)]="nuevoProd.objeto" class="form-control" placeholder="e.g., Broom">
    </div>
    <div class="col-md-2">
      <label class="form-label">Quantity</label>
      <input type="number" [(ngModel)]="nuevoProd.cantidad" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Exchange (Trade or Price)</label>
      <input type="text" [(ngModel)]="nuevoProd.intercambio" class="form-control" placeholder="e.g., For a lawn mower">
    </div>
    <div class="col-md-12 text-end">
      <button class="btn btn-primary" (click)="agregar()">Save to Neighborhood Network</button>
    </div>
  </div>
</div>
