<div class="container mt-5">

  <div class="card shadow mb-4">
    <div class="card-body text-center bg-primary text-white rounded">
      <h1 class="font-weight-bold">
        <i class="bi bi-box-seam"></i> Neighborhood Inventory
      </h1>
      <p class="mb-0">Secure community management system</p>
    </div>
  </div>

  @if (!currentUser()) {
    
    <app-login></app-login>

  } @else {
    
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-light border rounded shadow-sm">
      <h4 class="text-secondary mb-0">
        <i class="bi bi-person-circle"></i> Welcome, <strong>{{ currentUser() }}</strong>
      </h4>
      <button class="btn btn-outline-danger btn-sm" (click)="logout()">
        <i class="bi bi-door-open"></i> Logout
      </button>
    </div>

    <app-formularioprod (productoCreado)="onProductoAgregado($event)"></app-formularioprod>

    <hr class="my-4">

    <app-tabla-inventario 
      [misProductos]="listaGlobal" 
      (productoEliminado)="onEliminarProducto($event)">
    </app-tabla-inventario>

    <div class="mt-5 p-2 bg-dark text-success rounded">
      <small>System Status: Secured Connection Active</small>
    </div>
  }

</div>
