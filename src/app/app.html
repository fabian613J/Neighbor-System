<div class="app-layout" [class.has-sidebar]="showSidebar()">

  <!-- Sidebar — only visible when logged in -->
  @if (showSidebar()) {
    <nav class="sidebar d-flex flex-column">
      <div class="sidebar-brand">
        <i class="bi bi-houses-fill me-2"></i>
        <span>Friendly<br><strong>Neighbourhood</strong></span>
      </div>

      <ul class="nav flex-column flex-grow-1 mt-3">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/inventory" routerLinkActive="active">
            <i class="bi bi-boxes me-2"></i> Inventory
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/loans" routerLinkActive="active">
            <i class="bi bi-arrow-left-right me-2"></i> Loans
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/neighbors" routerLinkActive="active">
            <i class="bi bi-people me-2"></i> Neighbors
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="text-white-50 small mb-2">
          <i class="bi bi-person-circle me-1"></i> {{ currentUser() }}
        </div>
        <button class="btn btn-outline-light btn-sm w-100" (click)="logout()">
          <i class="bi bi-door-open me-1"></i> Logout
        </button>
      </div>
    </nav>
  }

  <!-- Single persistent router-outlet — with key to force recreation -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
