<div class="container mt-4">
  <div class="table-responsive">
    <table class="table table-striped table-hover border shadow-sm text-center align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Neighbor</th>
          <th>Item</th>
          <th>Stock</th>
          <th>Exchange / Trade</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of misProductos; track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td><strong>{{ item.vecino }}</strong></td>
            <td>{{ item.objeto }}</td>
            <td>
              <span class="badge" [class.bg-success]="item.cantidad > 0" [class.bg-danger]="item.cantidad <= 0">
                {{ item.cantidad }}
              </span>
            </td>
            <td>
              <i class="bi bi-arrow-left-right text-primary me-1"></i> 
              {{ item.intercambio }}
            </td>
            <td>
              <button class="btn btn-sm btn-outline-danger" (click)="notificarEliminacion(item.id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="text-muted py-4">
              <i class="bi bi-info-circle"></i> No items found in the neighborhood network.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
